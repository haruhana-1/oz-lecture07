<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>반윤정 포트폴리오</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <header>
      <h1>BAN YUNJEONG</h1>
      <nav class="nav">
        <span class="logo">반윤정</span>
        <ul class="menu">
          <li><a href="#intro">About Me</a></li>
          <li><a href="#work">Works</a></li>
          <li><a href="#contact">Contact</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section id="intro">
        <h2>About Me</h2>
        <p class="lead">웹 개발을 처음 배우고 있습니다.</p>
        <img src="test.png" alt="반윤정의 프로필 사진">
      </section>

      <section id="work">
        <h2>Works</h2>

        <div class="cards">
          <article class="card">
            <h3>개인 소개 페이지</h3>
            <p>HTML만으로 만든 첫 페이지입니다.</p>
          </article>

          <article class="card">
            <h3>회원가입 폼</h3>
            <p>입력 요소와 기본 검증을 연습했습니다.</p>
          </article>

          <article class="card">
            <h3>시맨틱 구조 정리</h3>
            <p>검색엔진과 화면낭독기를 고려했습니다.</p>
          </article>
        </div>
      </section>

      <section id="contact">
        <h2>Contact</h2>

        <form action="/contact" method="post">
          <fieldset>
            <legend>Send a Message</legend>

            <label for="name">name</label>
            <input type="text" id="name" name="name" required>

            <label for="message">Message</label>
            <textarea id="message" name="message" rows="4"></textarea>

            <button type="submit">보내기</button>
          </fieldset>
        </form>
      </section>
    </main>

    <footer>
      <p>2026 반윤정 010-xxxx-xxxx</p>
    </footer>
  </body>
</html>
