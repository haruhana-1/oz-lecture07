<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="반윤정의 개인 포트폴리오">
    <title>BAN YUNJEONG | Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="header">
        <div class="container">
            <h1>BAN YUNJEONG</h1>

            <nav class="nav" aria-label="주 메뉴">
                 <ul class="menu">
                    <li><a href="#intro">About Me</a></li>
                    <li><a href="#work">Works</a></li>
                    <li><a href="#contact">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container">

        <section id="intro" class="intro-section">
            <div class="intro-text">
                <h2>About Me</h2>
                <p class="lead">
                    웹 개발을 처음 배우고 있습니다.
                </p>
            </div>

            <img
                src="test.png"
                alt="반윤정의 프로필 사진"
                class="profile-image"
            >
        </section>

        <section id="work" class="work-section">
            <h2>Works</h2>

            <div class="cards">
                <article class="card">
                    <h3>개인 소개 페이지</h3>
                    <p>HTML만으로 만든 첫 페이지입니다.</p>
                </article>

                <article class="card">
                    <h3>회원가입 폼</h3>
                    <p>입력 요소와 기본 검증을 연습했습니다.</p>
                </article>

                <article class="card">
                    <h3>시맨틱 구조 정리</h3>
                    <p>검색엔진과 화면낭독기를 고려했습니다.</p>
                </article>
            </div>
        </section>

        <section id="contact" class="contact-section">
            <h2>Contact</h2>

            <form action="/contact" method="post">
                <fieldset>
                    <legend>Send a Message</legend>

                    <label for="name">Name</label>
                    <input
                        type="text"
                        id="name"
                        name="name"
                        required
                    >

                    <label for="message">Message</label>
                    <textarea
                        id="message"
                        name="message"
                        rows="5"
                        required
                    ></textarea>

                    <button type="submit">보내기</button>
                </fieldset>
            </form>
        </section>

    </main>

    <footer class="footer">
        <p>© 2026 BAN YUNJEONG. All rights reserved.</p>
    </footer>
</body>
</html>
